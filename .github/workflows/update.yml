name: Update timeline page

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch:         # "Run workflow" button for manual refreshes

permissions:
  contents: write            # commit data/week.json back to the repo
  pages: write
  id-token: write

concurrency:
  group: timeline-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch, judge with Jev, write thesis, build page
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}   # Jev + Claude via Vercel AI Gateway
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}       # optional: Jev direct instead
        run: python -m pipeline.run

      - name: Save this week's state
        run: |
          git config user.name "timeline-bot"
          git config user.email "timeline-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update timeline $(date -u +'%a %H:%M UTC')"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
