name: Deliver the daily read

on:
  schedule:
    - cron: "47 * * * *"    # hourly, so the daily Slack post lands within the hour of `hour_pt`
  workflow_dispatch:

permissions:
  contents: write            # record slack_last_post / slack_last_error in data/week.json

concurrency:
  group: timeline-update     # never overlaps an update, so the two don't race on data/week.json
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Post to Slack if it's due (saved state only, no API calls)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m pipeline.run --deliver

      - name: Save delivery state
        if: ${{ !cancelled() }}
        run: |
          git config user.name "timeline-bot"
          git config user.email "timeline-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Record Slack delivery"
          git pull --rebase    # settings may have been saved from the page mid-run
          git push
