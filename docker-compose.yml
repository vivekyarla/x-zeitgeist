# docker compose up --build   → http://localhost:8000
# Put SECRET_KEY and BASE_URL in .env (see .env.example) before exposing it beyond localhost.
services:
  timeline:
    build: .
    ports:
      - "8000:8000"
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      SECRET_KEY: ${SECRET_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-3}
      REFRESH_HOURS: ${REFRESH_HOURS:-3}
      TIMELINE_DEMO: ${TIMELINE_DEMO:-0}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      PREVIEW_TWITTERAPI_IO_KEY: ${PREVIEW_TWITTERAPI_IO_KEY:-}
      PREVIEW_AI_GATEWAY_API_KEY: ${PREVIEW_AI_GATEWAY_API_KEY:-}
      PREVIEW_PRESET: ${PREVIEW_PRESET:-ai_startup_marketing}
    volumes:
      - timeline-data:/data
    restart: unless-stopped

volumes:
  timeline-data:
